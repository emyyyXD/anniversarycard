<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Dynamic mobile viewport fix -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy Anniversary</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100dvh; /* Prevents address bar jumping on Android */
      width: 100%;
      background-color: #0d0d1a;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Ambient background glows */
    .bg-glow {
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      opacity: 0.5;
      pointer-events: none;
    }
    .glow1 { top: -50px; left: -50px; background: #ff007f; }
    .glow2 { bottom: -50px; right: -50px; background: #7f00ff; }

    .page {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 1;
      padding: 20px;
    }

    .login-wrap {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      text-align: center;
    }

    /* Responsive headline scaling for mobile displays */
    .hero-text h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      color: #fff;
      text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f, 0 0 40px #ff007f;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .hero-text p {
      font-size: 1.1rem;
      color: #e0e0e0;
      line-height: 1.5;
    }

    .divider {
      font-size: clamp(1.2rem, 4vw, 1.8rem);
      color: #fff;
      text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
      margin-top: 15px;
      letter-spacing: 2px;
    }

    /* Card styling */
    .login-card {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .login-card h2 {
      font-size: 1.5rem;
      color: #fff;
    }

    .hint {
      font-size: 0.9rem;
      color: #d1b3c4;
    }

    label {
      font-size: 0.85rem;
      color: #e0e0e0;
      text-align: left;
    }

    /* Input optimized for mobile touch targets */
    .date-input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 0, 127, 0.4);
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      font-size: 1rem;
      outline: none;
      text-align: center;
      color-scheme: dark; /* Ensures dark mode datepicker in Android Chrome */
    }

    .date-input:focus {
      border-color: #ff007f;
      box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
    }

    /* Button optimized for mobile taps */
    button.primary {
      width: 100%;
      padding: 15px;
      border-radius: 30px;
      border: none;
      background: linear-gradient(135deg, #ff007f, #ff4b2b);
      color: white;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    button.primary:active {
      transform: scale(0.97);
    }

    #error {
      color: #ff4d4d;
      font-size: 0.85rem;
      min-height: 18px;
    }

    small {
      color: #a98692;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="bg-glow glow1"></div>
  <div class="bg-glow glow2"></div>

  <!-- LOGIN PAGE -->
  <section id="login" class="page active">
    <div class="login-wrap">
      
      <div class="hero-text">
        <h1>Happy Anniversary</h1>
        <p>Every love story is beautiful,<br>but ours is my favorite.</p>
        <div class="divider">─── ALIP ♡ IKA ───</div>
      </div>

      <div class="login-card">
        <h2>Our Little Secret 💌</h2>
        <p class="hint">Only our special date can open this love story.</p>
        
        <label for="anniversaryDate">Enter our anniversary date</label>
        <input id="anniversaryDate" class="date-input" type="date">
        
        <button id="unlockBtn" class="primary">Unlock Our Memories ♡</button>
        
        <div id="error"></div>
        <small>🔒 A special surprise is waiting inside...</small>
      </div>

    </div>
  </section>

  <script>
    // Set your correct anniversary date here (Format: YYYY-MM-DD)
    const CORRECT_DATE = "2023-09-15"; 

    document.addEventListener('DOMContentLoaded', () => {
      const unlockBtn = document.getElementById('unlockBtn');
      const dateInput = document.getElementById('anniversaryDate');
      const errorDiv = document.getElementById('error');

      // Pointer event guarantees smooth execution on both Android taps and mouse clicks
      unlockBtn.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        unlock();
      });

      function unlock() {
        const userValue = dateInput.value;

        if (!userValue) {
          errorDiv.textContent = "Please select a date first! 💕";
          return;
        }

        if (userValue === CORRECT_DATE) {
          errorDiv.style.color = "#4dff88";
          errorDiv.textContent = "Unlocked! Opening our memories... ✨";
          
          setTimeout(() => {
            alert("Correct date! Add your page transition or next section display logic here.");
            // Example transition:
            // document.getElementById('login').style.display = 'none';
            // document.getElementById('secretPage').classList.add('active');
          }, 400);
        } else {
          errorDiv.style.color = "#ff4d4d";
          errorDiv.textContent = "Oops! That's not our date. Try again! 🤫";
        }
      }
    });
  </script>

</body>
</html>
