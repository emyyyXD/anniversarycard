<title>Forever & Always ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Playfair+Display:wght@500;600&display=swap');

*{
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: #080208;
  color: #fff;
  overflow-x: hidden;
  font-family: 'Cormorant Garamond', serif;
}

/* PAGE WRAPPER & RESPONSIVENESS */
.page {
  min-height: 100vh;
  width: 100%;
  display: none;
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  background: 
    linear-gradient(rgba(8, 2, 8, 0.4), rgba(8, 2, 8, 0.4)),
    url('background.jpeg') center/cover no-repeat fixed;
  padding: 20px 10px;
}

.page.active {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.bg-glow {
  position: absolute;
  width: min(450px, 80vw);
  height: min(450px, 80vw);
  border-radius: 50%;
  background: rgba(255, 47, 113, 0.12);
  filter: blur(80px);
  pointer-events: none;
}
.glow1 { top: -100px; left: -100px; }
.glow2 { bottom: -100px; right: -100px; }

/* PETALS */
.particles, .petal-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 20;
  overflow: hidden;
}

.petal {
  position: absolute;
  top: -60px;
  font-size: 22px;
  filter: drop-shadow(0 0 5px rgba(255,80,130,.5));
  animation: fall linear forwards;
}

@keyframes fall {
  0% { transform: translate3d(0,-60px,0) rotate(0deg); opacity: 0; }
  10% { opacity: 0.9; }
  50% { transform: translate3d(40px,55vh,0) rotate(180deg); }
  100% { transform: translate3d(-50px,115vh,0) rotate(360deg); opacity: 0; }
}

/* LOGIN SECTION */
#login {
  align-items: center;
  justify-content: center;
  text-align: center;
}

.login-wrap {
  position: relative;
  z-index: 3;
  width: min(920px, 95%);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 30px;
  align-items: center;
  margin: auto;
}

.hero-text {
  text-align: left;
}

.hero-text h1 {
  font-family: "Great Vibes", cursive;
  font-weight: 400;
  font-size: clamp(42px, 8vw, 85px);
  line-height: 1;
  margin: 10px 0;
  color: #ffd2df;
  text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f, 0 0 40px #ff007f;
}

.hero-text p {
  font-size: clamp(18px, 4vw, 24px);
  color: #e8bfcb;
  max-width: 480px;
  margin: 10px 0;
}

.divider {
  font-size: clamp(1.2rem, 4vw, 2rem);
  color: #fff;
  text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f;
  margin: 15px 0;
}

.login-card {
  padding: 30px 20px;
  border-radius: 24px;
  border: 1px solid rgba(255,150,180,.4);
  background: rgba(20, 5, 18, 0.75);
  box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 30px rgba(255,65,123,.15);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  width: 100%;
}

.login-card h2 {
  font-family: "Playfair Display", serif;
  font-weight: 500;
  color: #ffe1e9;
  margin: 0 0 8px;
  font-size: 24px;
}

.login-card .hint {
  color: #cfa6b4;
  margin: 0 0 20px;
  font-size: 15px;
}

.login-card label {
  display: block;
  text-align: left;
  color: #ffd3df;
  margin-bottom: 8px;
  font-size: 16px;
}

.date-input {
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #b95777;
  background: #0d050c;
  color: #fff;
  text-align: center;
  outline: none;
  font-size: 16px;
  appearance: none;
  -webkit-appearance: none;
}

.date-input::-webkit-calendar-picker-indicator {
  cursor: pointer;
  filter: invert(1);
}

.primary {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border: 0;
  border-radius: 13px;
  color: #fff;
  font-size: 17px;
  font-weight: 600;
  background: linear-gradient(90deg, #8e234c, #e65e86, #8e234c);
  box-shadow: 0 10px 25px rgba(228,70,123,.25);
  transition: transform 0.2s, box-shadow 0.2s;
  cursor: pointer;
}

.primary:active {
  transform: scale(0.98);
}

#error {
  min-height: 24px;
  color: #ff9bb8;
  margin-top: 10px;
  font-size: 14px;
}
